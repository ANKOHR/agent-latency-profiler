[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-latency-profiler"
version = "0.1.0"
description = "Deterministic profiling of recorded workflow stage durations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
alp = "agent_latency_profiler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["agent_latency_profiler"]
